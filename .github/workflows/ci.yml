name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # Build the release commands by name rather than relying on ./..., which
      # stays green even when a command directory is missing from the commit.
      - name: Cross-compile every release target
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          for pkg in ./cmd/mini-container ./cmd/mini-container-launcher; do
            test -d "$pkg" || { echo "missing command directory: $pkg"; exit 1; }
          done
          # Every published target must keep compiling, including the non-Linux
          # stub that replaces the runtime where its syscalls do not exist.
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            for pkg in ./cmd/mini-container ./cmd/mini-container-launcher; do
              echo "==> $target $pkg"
              GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null "$pkg"
            done
          done
